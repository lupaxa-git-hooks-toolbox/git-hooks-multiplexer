[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-githooks-multiplexer"
version = "0.0.0"
description = "One Git hook script that runs every executable under hooks/<type>/."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.13"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["git", "hooks", "multiplexer", "pre-commit"]

dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-git-hooks-toolbox/git-hooks-multiplexer"
Repository = "https://github.com/lupaxa-git-hooks-toolbox/git-hooks-multiplexer"
Issues = "https://github.com/lupaxa-git-hooks-toolbox/git-hooks-multiplexer/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "bump-my-version>=1.2.0",
  "pip-audit>=2.7.0",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
# This repo ships one script, not an importable package.
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["src/multiplexer"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "ISC", "D", "ANN", "PT"]
ignore = [
  "D200", "D201", "D202", "D203", "D204", "D205", "D206", "D207", "D208", "D209", "D210", "D211", "D212",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"src/multiplexer" = ["D", "ANN"]
"tests/*" = ["S", "D", "ANN", "PT", "I", "UP", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/multiplexer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
